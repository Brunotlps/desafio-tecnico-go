name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (fmt, deps, vet, unit tests -race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: dependencies are verified and tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: unit tests (race detector)
        run: go test -race -count=1 ./...

  infra:
    name: infrastructure (compose, Keycloak realm, broker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: docker compose config --quiet
      - name: start PostgreSQL, Keycloak and the MiniStack broker (AUTH=true)
        run: docker compose up -d --wait postgres keycloak ministack
      - name: provision the broker (queues, topic, principals, policies, credentials)
        run: docker compose run --rm broker-provision
      - name: verify identities, queues, redrive, event destination, policies and credentials
        run: scripts/check-infra.sh
      - name: re-provisioning is idempotent and keeps the credentials in use
        run: |
          before=$(sha256sum .local/broker/credentials)
          docker compose run --rm broker-provision
          [ "$before" = "$(sha256sum .local/broker/credentials)" ] || { echo "credentials changed on re-provisioning"; exit 1; }
          scripts/check-infra.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v

  integration:
    name: integration (real PostgreSQL, Keycloak and MiniStack, -race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start PostgreSQL, Keycloak and the MiniStack broker (AUTH=true)
        run: docker compose up -d --wait postgres keycloak ministack
      - name: provision the broker
        run: docker compose run --rm broker-provision
      - name: integration tests (includes the broker authorization proof)
        run: go test -tags integration -race -count=1 -timeout 20m ./test/integration/...
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v

  stack:
    name: full stack (image build, migrations, API smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build and start the whole stack
        run: |
          docker compose up --build -d
          scripts/wait-healthy.sh api 180
      - name: smoke test (authenticated flow through the API)
        run: scripts/smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v
