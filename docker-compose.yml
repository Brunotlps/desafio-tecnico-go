# Ambiente local: PostgreSQL, Keycloak (IdP), LocalStack (SQS/SNS), migrations e API.
# Todas as credenciais abaixo são valores de desenvolvimento, não segredos reais.
name: wager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h): durante o initdb o servidor temporário escuta só no socket Unix, e um
      # pg_isready local já responderia "pronto" antes de o servidor definitivo aceitar conexões.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixa o issuer (claim iss) independentemente do host usado na requisição.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/wager-realm.json:/opt/keycloak/data/import/wager-realm.json:ro
    healthcheck:
      # A imagem não tem curl; testa o endpoint de saúde (porta de gestão 9000) via /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      # Provisiona filas, redrive e o destino dos eventos quando o LocalStack fica pronto.
      - ./deploy/localstack/provision.sh:/etc/localstack/init/ready.d/10-provision.sh:ro
    healthcheck:
      # Pronto quando os scripts de init (provision.sh) terminaram com sucesso.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true' && curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"state\": \"SUCCESSFUL\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Roda como o papel DONO do schema (wager). Aplica as migrations (inclusive as corretivas,
  # sem apagar dados) e cria/atualiza o papel de runtime com privilégios mínimos.
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
      RUNTIME_DB_ROLE: wager_app
      RUNTIME_DB_PASSWORD: wager_app_dev_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    # O encerramento gracioso da API leva até SHUTDOWN_TIMEOUT (20 s por padrão); o padrão do Docker (10 s)
    # enviaria SIGKILL antes de a drenagem, o cancelamento e o fechamento das dependências terminarem.
    stop_grace_period: 25s
    environment:
      HTTP_ADDR: ":8080"
      # Papel de runtime: não é dono das tabelas nem superusuário e não altera o ledger.
      DATABASE_URL: postgres://wager_app:wager_app_dev_password@postgres:5432/wager?sslmode=disable
      # O issuer é o que o IdP escreve nos tokens (host público); as chaves são buscadas pela rede do Compose.
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wager
      OIDC_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
      OIDC_AUDIENCE: wager-api
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      ALLOWED_CURRENCIES: BRL
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
